name: Publish

# npm Trusted Publishing（OIDC）：一次性前置是在 npm 网页给本包配置
# Trusted Publisher（owner Visdenda、repo agent-watch、workflow publish.yml）。
#
# --provenance 只在公开仓可用；发布脚本用 AGENT_WATCH_PROVENANCE=true 打开。
"on":
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Check npm CLI floor (trusted publishing needs >= 11.5.1)
        run: |
          npmv=$(npm --version)
          echo "node $(node --version) / npm $npmv"
          node -e "const [a,b]=process.argv[1].split('.').map(Number); if (a<11||(a===11&&b<5)) { console.error('npm '+process.argv[1]+' < 11.5.1: trusted publishing will fail'); process.exit(1); }" "$npmv"
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run check:package
      - run: npm run publish:npm
        env:
          AGENT_WATCH_PROVENANCE: "true"
